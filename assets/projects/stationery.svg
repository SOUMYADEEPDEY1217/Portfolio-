  <text x="180" y="272" fill="#9CA8B8" font-family="sans-serif" font-size="11">Papercraft</text>
  <text x="290" y="272" fill="#F8FAFC" font-family="sans-serif" font-size="11">420</text>
  <rect x="360" y="258" width="60" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="390" y="272" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">In Stock</text>

  <line x1="44" y1="324" x2="464" y2="324" stroke="#1E293B"/>
