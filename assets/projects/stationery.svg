  <text x="180" y="242" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="10">CATEGORY</text>
  <text x="290" y="242" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="10">QTY</text>
  <text x="360" y="242" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="10">STATUS</text>

