  <circle cx="44" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="22" r="5" fill="#10B981"/>
  <text x="400" y="27" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="12" text-anchor="middle">stationery-inventory.internal — Store Management System (Academic SRS / ERD)</text>

  <!-- Left Stats Overview -->
  <rect x="24" y="64" width="752" height="96" rx="12" fill="#121824" stroke="#1E293B"/>
  
  <rect x="44" y="80" width="160" height="64" rx="8" fill="#182232"/>
  <text x="60" y="102" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="11">TOTAL INVENTORY</text>
  <text x="60" y="130" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">14,280</text>
  <text x="140" y="130" fill="#10B981" font-family="sans-serif" font-size="11">SKUs Active</text>

  <rect x="224" y="80" width="160" height="64" rx="8" fill="#182232"/>
  <text x="240" y="102" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="11">DAILY TRANSACTIONS</text>
  <text x="240" y="130" fill="#FF9800" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">₹48,920</text>
  <text x="330" y="130" fill="#FFB347" font-family="sans-serif" font-size="11">+18.4%</text>

  <rect x="404" y="80" width="160" height="64" rx="8" fill="#182232"/>
  <text x="420" y="102" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="11">REORDER ALERTS</text>
  <text x="420" y="130" fill="#EF4444" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">12</text>
  <text x="460" y="130" fill="#EF4444" font-family="sans-serif" font-size="11">Items Low</text>

  <rect x="584" y="80" width="172" height="64" rx="8" fill="#182232"/>
  <text x="600" y="102" fill="#9CA8B8" font-family="'Space Grotesk', sans-serif" font-size="11">SCHEMA / RELATIONS</text>
  <text x="600" y="130" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">3NF Normalized</text>

  <!-- Left: Inventory Table Mockup -->
  <rect x="24" y="176" width="460" height="300" rx="12" fill="#111722" stroke="#1E293B"/>
  <text x="44" y="206" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Stock Inventory Ledger</text>
  <rect x="370" y="190" width="94" height="24" rx="6" fill="#1E293B"/>
  <text x="417" y="206" fill="#FF9800" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ New Batch</text>

  <!-- Table Header -->
  <rect x="44" y="224" width="420" height="28" rx="4" fill="#182232"/>
