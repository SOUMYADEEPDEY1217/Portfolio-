<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0C1017"/>
  <!-- Top bar -->
  <rect width="800" height="44" fill="#131923"/>
  <circle cx="28" cy="22" r="5" fill="#EF4444"/>
  <circle cx="44" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="22" r="5" fill="#10B981"/>
  <text x="400" y="27" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="12" text-anchor="middle">trailmind-ai.dev — Mission Command</text>
  
  <!-- Grid backdrop -->
  <line x1="240" y1="44" x2="240" y2="500" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#161F2E" stroke-width="1"/>
  
  <!-- Left Sidebar -->
  <rect x="20" y="64" width="200" height="416" rx="10" fill="#111722" stroke="#1E293B"/>
  <rect x="36" y="84" width="70" height="18" rx="4" fill="rgba(255,152,0,0.15)"/>
  <text x="44" y="97" fill="#FF9800" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">ACTIVE RADAR</text>
  
  <circle cx="120" cy="180" r="60" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="4 4" fill="rgba(255,152,0,0.03)"/>
  <circle cx="120" cy="180" r="40" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="180" r="20" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="180" x2="160" y2="150" stroke="#FF9800" stroke-width="2"/>
  <circle cx="160" cy="150" r="4" fill="#FF9800"/>
  
  <rect x="36" y="260" width="168" height="42" rx="6" fill="#182232" stroke="#1E293B"/>
  <text x="48" y="278" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Trail: Highland Ridge</text>
  <text x="48" y="293" fill="#9CA8B8" font-family="sans-serif" font-size="10">Elevation +840m • 14.2 km</text>
  
  <rect x="36" y="312" width="168" height="42" rx="6" fill="#182232" stroke="#1E293B"/>
  <text x="48" y="330" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">AI Mission: Wayfinder</text>
  <text x="48" y="345" fill="#FFB347" font-family="sans-serif" font-size="10">Ollama Local LLM Active</text>
  
  <rect x="36" y="364" width="168" height="42" rx="6" fill="#182232" stroke="#1E293B"/>
  <text x="48" y="382" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Weather: Clear 18°C</text>
  <text x="48" y="397" fill="#10B981" font-family="sans-serif" font-size="10">FastAPI Sync: 24ms</text>

  <!-- Main Map & Mission Area -->
  <rect x="256" y="64" width="524" height="260" rx="12" fill="#0E141D" stroke="#1E293B"/>
  <!-- Topographic elevation contours -->
  <path d="M 270 260 Q 340 120 420 180 T 560 140 T 700 240 T 760 220" stroke="#FF9800" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 270 290 Q 360 160 450 210 T 600 170 T 730 280" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
  <path d="M 270 220 Q 320 80 400 130 T 520 100 T 670 190" stroke="#475569" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Waypoints -->
  <circle cx="360" cy="150" r="6" fill="#FF9800"/>
  <rect x="330" y="115" width="60" height="22" rx="4" fill="#1E293B"/>
  <text x="360" y="130" fill="#FFB347" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle">Waypoint Alpha</text>
  
  <circle cx="560" cy="140" r="6" fill="#10B981"/>
  <rect x="530" y="105" width="60" height="22" rx="4" fill="#1E293B"/>
  <text x="560" y="120" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle">Reflect Point</text>
  
  <!-- Bottom Cards -->
  <rect x="256" y="340" width="250" height="140" rx="10" fill="#111722" stroke="#1E293B"/>
  <text x="276" y="368" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">AI Reflection Engine</text>
  <text x="276" y="390" fill="#9CA8B8" font-family="sans-serif" font-size="11">Automated sensory journaling with</text>
  <text x="276" y="406" fill="#9CA8B8" font-family="sans-serif" font-size="11">geotagged terrain snapshots &amp; NLP.</text>
  <rect x="276" y="426" width="90" height="24" rx="4" fill="rgba(255,152,0,0.15)" stroke="rgba(255,152,0,0.3)"/>
  <text x="321" y="442" fill="#FF9800" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">FastAPI + Ollama</text>

  <rect x="522" y="340" width="258" height="140" rx="10" fill="#111722" stroke="#1E293B"/>
  <text x="542" y="368" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">PostgreSQL Memory Hub</text>
  <text x="542" y="390" fill="#9CA8B8" font-family="sans-serif" font-size="11">Structured trajectory vectors,</text>
  <text x="542" y="406" fill="#9CA8B8" font-family="sans-serif" font-size="11">checkpoint timestamps &amp; elevation cache.</text>
  <rect x="542" y="426" width="105" height="24" rx="4" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)"/>
  <text x="594" y="442" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">React • TypeScript</text>
</svg>
